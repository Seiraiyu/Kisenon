[project]
name = "job-queue"
version = "0.1.0"
description = "Postgres job queue: FOR UPDATE SKIP LOCKED, retries with backoff, LISTEN/NOTIFY wakeups."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["psycopg[binary]>=3.3", "python-dotenv>=1.0"]

[project.optional-dependencies]
dev = ["pytest>=9.0", "ruff>=0.16"]

[project.scripts]
job-queue = "job_queue.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/job_queue"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
