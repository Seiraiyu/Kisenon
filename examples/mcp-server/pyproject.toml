[project]
name = "kisenon-mcp"
version = "0.1.0"
description = "MCP server that gives Claude Code / Cursor / Claude Desktop disposable Kisenon forks as tools."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "mcp>=2.2,<3",
  "psycopg[binary]>=3.3,<4",
  "python-dotenv>=1.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0",
  "ruff>=0.16",
]

[project.scripts]
kisenon-mcp = "kisenon_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kisenon_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
