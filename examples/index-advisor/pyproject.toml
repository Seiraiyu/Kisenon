[project]
name = "index-advisor"
version = "0.1.0"
description = "pg_stat_statements top queries -> LLM index candidates -> each benchmarked on its own Kisenon fork."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "anthropic>=1.8",
  "openai>=3.0",
  "psycopg[binary]>=3.2",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
]

[project.scripts]
index-advisor = "index_advisor.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/index_advisor"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
