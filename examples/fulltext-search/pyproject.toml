[project]
name = "fulltext-search"
version = "0.1.0"
description = "Postgres full-text search (tsvector + GIN + websearch_to_tsquery) with a pg_trgm fuzzy fallback."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["psycopg[binary]>=3.3", "python-dotenv>=1.0"]

[project.optional-dependencies]
dev = ["pytest>=9.0", "ruff>=0.16"]

[project.scripts]
fulltext-search = "fulltext_search.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fulltext_search"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
