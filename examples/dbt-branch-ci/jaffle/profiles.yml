# dbt-branch-ci sets these env vars from the branch's connection string, so the
# same profile targets main (baseline) or a fork (check). DBT_ENV_SECRET_* is
# scrubbed from dbt's logs.
jaffle:
  target: kisenon
  outputs:
    kisenon:
      type: postgres
      host: "{{ env_var('DBT_HOST') }}"
      port: "{{ env_var('DBT_PORT', '5432') | as_number }}"
      user: "{{ env_var('DBT_USER') }}"
      password: "{{ env_var('DBT_ENV_SECRET_PASSWORD') }}"
      dbname: "{{ env_var('DBT_DBNAME') }}"
      schema: dbt_branch_ci
      threads: 4
      sslmode: require
