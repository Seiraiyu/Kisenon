[project]
name = "dbt-branch-ci"
version = "0.1.0"
description = "Run dbt build on a Kisenon fork of main and fail CI on row-count or schema drift."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "dbt-core>=1.10.5,<2",
  "dbt-postgres>=1.10,<2",
  "psycopg2-binary>=2.9",
  "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
  "pytest>=9.0",
  "ruff>=0.16",
]

[project.scripts]
dbt-branch-ci = "dbt_branch_ci.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dbt_branch_ci"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
