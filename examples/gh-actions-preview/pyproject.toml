[project]
name = "gh-actions-preview"
version = "0.1.0"
description = "GitHub Actions workflow: a Kisenon preview branch per pull request."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[dependency-groups]
dev = [
  "pytest>=9.0",
  "ruff>=0.16",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
