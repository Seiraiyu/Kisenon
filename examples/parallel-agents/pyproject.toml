[project]
name = "parallel-agents"
version = "0.1.0"
description = "N LLM agents race to speed up one query, each on its own Kisenon fork; the measured winner is kept."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "anthropic>=1.8",
  "openai>=3.0",
  "psycopg[binary]>=3.2",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
]

[project.scripts]
parallel-agents = "parallel_agents.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/parallel_agents"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
