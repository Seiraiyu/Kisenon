[project]
name = "text2sql-eval"
version = "0.1.0"
description = "Grade an LLM's text-to-SQL against a Kisenon fork, destructive cases included."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "anthropic>=1.8",
  "openai>=3.0",
  "psycopg[binary]>=3.2",
  "python-dotenv>=1.0",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
]

[project.scripts]
text2sql-eval = "text2sql_eval.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/text2sql_eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
